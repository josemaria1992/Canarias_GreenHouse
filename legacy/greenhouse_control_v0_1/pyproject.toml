[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquacrop-greenhouse-control"
version = "0.1.0"
description = "AquaCrop greenhouse local-first simulation and Modbus test software"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pymodbus>=3.10,<4",
  "pyserial>=3.5,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
aquacrop = "greenhouse.__main__:main"

[tool.setuptools.packages.find]
include = ["greenhouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
