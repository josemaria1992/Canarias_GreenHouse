# TEST FIXTURE: a copy of the CM4 bench configuration (bench-20261023-195449, read 2026-10-24) with the
# serial ports replaced by in-memory test buses. Not commissioning evidence.
# Bench configuration made by `aquacrop hw make-config` from the module setup records:
#   setup-relay_A.json, setup-relay_B.json, setup-digital_A.json, setup-digital_B.json, setup-analog_A.json, setup-analog_B.json
# HARDWARE_READ_ONLY: AquaCrop reads every module. Outputs switch only under a bench lease armed in the
# browser by a commissioning user, or OFF at the safe-state moments below (ADR-0017).
# Nothing here assigns a channel to a plant signal: assignments are made and verified on the I/O board.
schema_version: 1
config_id: bench-malmo
config_version: bench-20261023-195449
profile: HARDWARE_READ_ONLY
label: REAL BENCH — read only, outputs only under a bench lease
site:
  name: AquaCrop bench
  timezone: Europe/Stockholm
buses:
- bus_id: rs485_a
  kind: rtu
  port: aquafake://BENCH_A
  port_evidence: 'Port1=/dev/ttyAMA3, Port2=/dev/ttyAMA4: single-module hw scan on
    each of ttyAMA3/4/5, 2026-10-23'
  serial: &id001
    baudrate: 9600
    parity: N
    bytesize: 8
    stopbits: 1
    timeout_s: 0.3
    read_retries: 1
  poll_interval_s: 1.0
- bus_id: rs485_b
  kind: rtu
  port: aquafake://BENCH_B
  port_evidence: 'Port1=/dev/ttyAMA3, Port2=/dev/ttyAMA4: single-module hw scan on
    each of ttyAMA3/4/5, 2026-10-23'
  serial: *id001
  poll_interval_s: 1.0
