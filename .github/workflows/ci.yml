# CI for the AquaCrop platform. Software checks only: nothing here touches hardware, and a green
# run is not hardware or commissioning evidence.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-24.04-arm      # ARM64 Linux, closest hosted match to the CM4 (not a CM4)
            python: "3.11"
          - os: ubuntu-24.04-arm
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Install rclone (offsite backup round trip through a local crypt remote)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone && rclone version
      - name: Tests
        run: python -m pytest -q -p no:warnings
        env:
          AQUACROP_REQUIRE_RCLONE: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
      - name: Headless demo verification
        run: |
          python -m aquacrop demo verify --config demo-48 --seed 42
          python -m aquacrop demo verify --config demo-24 --seed 42
          python -m aquacrop demo verify --config installation-48 --seed 42
          python -m aquacrop demo verify --config installation-80 --seed 42
      - name: Simulation never loads serial libraries
        shell: python
        run: |
          import sys, aquacrop.cli, aquacrop.api.app
          aquacrop.cli.build_parser()
          bad = [m for m in sys.modules if m.split(".")[0] in ("serial", "pymodbus")]
          assert not bad, bad

  wheel:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m build --wheel -o dist .
      - name: Install wheel outside the source tree and exercise it
        shell: bash
        run: |
          W="$RUNNER_TEMP/wheeltest"
          python -m venv "$W"
          PY="$W/bin/python"; [ -x "$PY" ] || PY="$W/Scripts/python.exe"
          "$PY" -m pip install --require-hashes -r requirements.lock
          "$PY" -m pip install --no-deps dist/*.whl
          "$PY" -m pip check
          cp scripts/check_installed_wheel.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP" && "$PY" check_installed_wheel.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: wheel
          path: dist/*.whl

  ui:
    # Installation pages in headless Chromium (UI-01 to UI-05): every page, the clickable diagram, the
    # owner walkthrough with a restart, viewer refusals, offline/reconnect and three viewports. Simulation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser checks
        run: python scripts/ui_check/run_ui_check.py --out ui-evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: ui-evidence

  launcher:
    # DL-01: the desktop launcher wrappers from a source checkout: they create their own environment,
    # then run the prerequisite checks. The full cold start, first administrator, sign-in, clean stop
    # and restart run in tests/integration/test_launcher.py on every platform of the test job.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          AQUACROP_NO_PAUSE: "1"
        run: launchers\AquaCrop-Demo.cmd --check-only
      - name: macOS / Linux launcher
        if: runner.os != 'Windows'
        run: sh launchers/aquacrop-demo.sh --check-only

  release:
    # DL-05: the release ZIP with offline wheelhouses for the Windows demo (py3.12) and the CM4 (aarch64, py3.11,
    # Raspberry Pi OS Bookworm), its SHA-256 manifest and RELEASE.json. Two passes with the same wheel: pass 1 is
    # extracted and started through its own aquacrop-demo.sh for Claude's browser rehearsal of the owner tour
    # (UAT-01..16, headless Chromium, screenshots); pass 2 adds that illustrated guide and the wheelhouses, and the
    # extracted result is checked by verify_release.py. Simulation only; owner results stay NOT RUN.
    needs: [test, wheel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the 0.3.1 fixture below is built from its own commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build tools and Playwright
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: "Pass 1: build, extract, rehearse the owner tour through the release launcher"
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          T="$RUNNER_TEMP"
          python scripts/build_release.py --out "$T/pass1"
          mkdir "$T/x1" && unzip -q "$T"/pass1/aquacrop-*.zip -d "$T/x1"
          REL1=$(ls -d "$T"/x1/aquacrop-*)
          VERSION=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$REL1/RELEASE.json")
          AQ_EXPECT_RELEASE="$VERSION" python scripts/ui_check/run_tour_rehearsal.py --out "$T/tour-evidence" \
            --launcher "$REL1/aquacrop-demo.sh"
      - name: "Pass 2: same wheel and build time, with the illustrated guide and the wheelhouses"
        run: |
          T="$RUNNER_TEMP"; REL1=$(ls -d "$T"/x1/aquacrop-*)
          BUILT=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['built_utc'])" "$REL1/RELEASE.json")
          python scripts/build_release.py --out dist-release --wheel "$(ls "$REL1"/wheels/aquacrop_greenhouse-*.whl)" \
            --built-utc "$BUILT" --owner-tour "$T/tour-evidence" --wheelhouse win_amd64:3.12 --wheelhouse aarch64:3.11
          mkdir "$T/x2" && unzip -q dist-release/aquacrop-*.zip -d "$T/x2"
          REL2=$(ls -d "$T"/x2/aquacrop-*)
          python - "$REL1/RELEASE.json" "$REL2/RELEASE.json" <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:])
          keys = ("version", "commit", "tree_clean", "built_utc", "wheel", "requirements_lock_sha256")
          diff = [k for k in keys if a[k] != b[k]]
          print("the rehearsed and the delivered release share", ", ".join(keys), "" if not diff else f"EXCEPT {diff}")
          raise SystemExit(1 if diff else 0)
          PY
      - name: Verify the extracted release with the rehearsed environment
        run: |
          T="$RUNNER_TEMP"; REL2=$(ls -d "$T"/x2/aquacrop-*)
          PY=$(ls -d "$HOME"/.local/share/aquacrop/venv-*/bin/python | head -n 1)
          python scripts/verify_release.py --release "$REL2" --zip "$(ls dist-release/aquacrop-*.zip)" --python "$PY" \
            --json "$T/tour-evidence/verify-release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist-release/*.zip
            dist-release/*.zip.sha256
      - name: Build the provisional 0.3.1 demo from its own commit (main at bcd6200), for the upgrade test
        run: |
          git worktree add "$RUNNER_TEMP/v031" bcd620094fdfadbe466a973f27d67b5592c600d9
          cd "$RUNNER_TEMP/v031" && python scripts/build_release.py --out "$RUNNER_TEMP/old" --wheelhouse win_amd64:3.12
      - uses: actions/upload-artifact@v4
        with:
          name: release-0.3.1
          path: |
            ${{ runner.temp }}/old/*.zip
            ${{ runner.temp }}/old/*.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: ${{ runner.temp }}/tour-evidence

  release-windows:
    # DL-01 from the ZIP on Windows, through AquaCrop-Demo.cmd as the owner starts it: a cold start offline
    # from the bundled wheelhouse (package index disabled) with the first administrator, sign-in, browser
    # assets, version and release check, a clean stop and a restart that keeps the data; the installed-wheel
    # check outside any source tree; and an upgrade over the provisional 0.3.1 demo (rebuilt from its commit
    # bcd6200 in the release job), keeping accounts, recipes, history and backups. Simulation only.
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: new
      - name: Unpack and verify
        shell: bash
        run: |
          (cd new && sha256sum -c aquacrop-*.zip.sha256)
          unzip -q new/aquacrop-*.zip -d unpacked
          cd unpacked/aquacrop-* && sha256sum -c --quiet MANIFEST.sha256
      - name: Launcher checks, offline
        shell: cmd
        env:
          AQUACROP_NO_PAUSE: "1"
          PIP_NO_INDEX: "1"
          LOCALAPPDATA: ${{ runner.temp }}\checks
        run: |
          for /d %%D in (unpacked\aquacrop-*) do call "%%D\AquaCrop-Demo.cmd" --check-only || exit /b 1
      - name: Cold start, first administrator, sign-in, clean stop; then a restart that keeps the data
        shell: bash
        env:
          PIP_NO_INDEX: "1"
        run: |
          T="$RUNNER_TEMP"; E="$T/evidence"; mkdir -p "$E"
          L=$(ls -d unpacked/aquacrop-*)/AquaCrop-Demo.cmd
          V=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$(dirname "$L")/RELEASE.json")
          python scripts/release_smoke.py --launcher "$L" --local "$T/cold" --secret "$T/pw-cold" --first --seed \
            --record "$E/cold-1.json" --expect-version "$V"
          python scripts/release_smoke.py --launcher "$L" --local "$T/cold" --secret "$T/pw-cold" \
            --compare "$E/cold-1.json" --record "$E/cold-2.json" --expect-version "$V"
      - name: Installed-wheel check with the launcher's environment
        shell: bash
        run: |
          PY=$(ls -d "$RUNNER_TEMP"/cold/AquaCrop/venv-aquacrop_greenhouse-*/Scripts/python.exe | head -n 1)
          cp unpacked/aquacrop-*/check_installed_wheel.py "$RUNNER_TEMP/" && cd "$RUNNER_TEMP" && "$PY" check_installed_wheel.py
      - uses: actions/download-artifact@v4
        with:
          name: release-0.3.1
          path: old
      - name: Upgrade over the provisional 0.3.1 demo
        shell: bash
        env:
          PIP_NO_INDEX: "1"
        run: |
          T="$RUNNER_TEMP"; E="$T/evidence"
          (cd old && sha256sum -c aquacrop-*.zip.sha256)
          unzip -q old/aquacrop-*.zip -d old-unpacked
          OLD=$(ls -d old-unpacked/aquacrop-*)/AquaCrop-Demo.cmd; NEW=$(ls -d unpacked/aquacrop-*)/AquaCrop-Demo.cmd
          V=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$(dirname "$NEW")/RELEASE.json")
          python scripts/release_smoke.py --launcher "$OLD" --local "$T/upgrade" --secret "$T/pw-up" --first --seed \
            --record "$E/upgrade-0.3.1.json" --expect-version 0.3.1 --expect-release ANY
          python scripts/release_smoke.py --launcher "$NEW" --local "$T/upgrade" --secret "$T/pw-up" \
            --compare "$E/upgrade-0.3.1.json" --record "$E/upgrade-new.json" --expect-version "$V"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-windows-evidence
          path: ${{ runner.temp }}/evidence

  release-cm4-staging:
    # DL-02 from the ZIP on an ARM64 runner (not a CM4): the guided installer, staged under a temporary
    # root (no user, ownership or systemd changes), offline from the aarch64 wheelhouse; then the staged
    # application runs its checks; then upgrade and rollback switch releases.
    needs: release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Install, check, upgrade and roll back in a staging root
        run: |
          sha256sum -c aquacrop-*.zip.sha256
          unzip -q aquacrop-*.zip -d unpacked && cd unpacked/aquacrop-*
          R="$RUNNER_TEMP/root"
          python deploy/aquacrop-cm4.py --root "$R" check --release .
          python deploy/aquacrop-cm4.py --root "$R" install --release . --config configs/hardware-read-only.example.yaml
          PY="$R/opt/aquacrop/current/venv/bin/python"
          "$PY" -m aquacrop demo verify --config installation-80 --seed 42
          "$PY" -m aquacrop demo verify --config installation-48 --seed 42   # legacy 48-point fixture
          cp check_installed_wheel.py "$RUNNER_TEMP/" && (cd "$RUNNER_TEMP" && "$PY" check_installed_wheel.py)
          echo "AQUACROP_CONFIG=$PWD/configs/installation-80.yaml" > "$R/etc/aquacrop/aquacrop.env"
          python deploy/aquacrop-cm4.py --root "$R" upgrade --release . --reinstall
          python deploy/aquacrop-cm4.py --root "$R" rollback
          python deploy/aquacrop-cm4.py --root "$R" status

