<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaCrop digital twin</title>
<link rel="stylesheet" href="static/app.css">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
</head>
<body class="twin-page">
<div id="banner" class="banner twin-banner" role="status">DIGITAL TWIN — simulated modules, no real outputs</div>
<section id="login-view" class="login hidden">
  <form id="login-form" class="card narrow">
    <h1>AquaCrop digital twin</h1>
    <p class="muted">Use your login of the real dashboard.</p>
    <label>Login name <input name="username" autocomplete="username" required maxlength="32"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <button type="submit">Log in</button>
    <p id="login-error" class="error"></p>
  </form>
</section>
<div id="app" class="hidden">
  <header class="topbar"><a href="/" class="button ghost">← Real system</a> <strong>Digital twin</strong> <span id="who" class="muted"></span>
    <span id="build" class="build-id" title="The program running here"></span>
    <button id="logout" class="ghost">Log out</button></header>
  <div id="identity-warn" class="identity-warn hidden" role="alert"></div>
  <main id="main"></main>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="static/icons.js"></script>
<script src="static/ids.js"></script>
<script src="static/layout.js"></script>
<script src="static/twin.js"></script>
<script src="static/twin-diagram.js"></script>
<script src="static/twin-changes.js"></script>
<script src="static/router.js"></script>
<script src="static/hydraulic-editor.js"></script>
<script src="static/twin-graph.js"></script>
<script src="static/twin-modules.js"></script>
</body>
</html>
